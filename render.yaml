services:
  - type: web
    name: nexus-resolve
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-native-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        value: sqlite:///./data/entity_store.db
      - key: CORS_ORIGINS
        value: "*"
      - key: INTERNAL_API_URL
        value: http://127.0.0.1:8000
